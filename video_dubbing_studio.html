<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Dubbing Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow-x: hidden;
        }
        
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }

        /* Timeline and Chunks */
        #timeline-container {
            position: relative;
            background: repeating-linear-gradient(
                90deg,
                rgba(255,255,255,0.05) 0px,
                rgba(255,255,255,0.05) 1px,
                transparent 1px,
                transparent 100px
            );
        }

        .audio-chunk {
            position: absolute;
            height: 100%;
            border-radius: 0.375rem;
            cursor: grab;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 0.5rem;
            user-select: none;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            transition: background-color 0.2s, box-shadow 0.2s;
            overflow: hidden;
            white-space: nowrap;
        }

        .audio-chunk:active {
            cursor: grabbing;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            z-index: 50;
        }

        .chunk-controls {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(0,0,0,0.4);
            padding: 0.1rem 0.4rem;
            border-radius: 0.25rem;
        }
        
        input[type=range] {
            accent-color: #6366f1;
        }
        
        #playhead {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 2px;
            background-color: #ef4444;
            z-index: 100;
            pointer-events: none;
        }

        #playhead::before {
            content: '';
            position: absolute;
            top: 0;
            left: -4px;
            width: 10px;
            height: 10px;
            background-color: #ef4444;
            border-radius: 50%;
        }

    </style>
</head>
<body class="min-h-screen flex flex-col h-screen">

    <header class="glass-panel p-4 flex items-center justify-between z-10 shrink-0">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-lg bg-indigo-600 flex items-center justify-center text-xl shadow-lg">
                <i class="fa-solid fa-microphone-lines"></i>
            </div>
            <div>
                <h1 class="text-xl font-bold tracking-tight">Dubbing Studio</h1>
                <p class="text-xs text-slate-400">Professional Audio Sync</p>
            </div>
        </div>
        <div class="flex gap-3">
            <label class="px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded-lg cursor-pointer transition-colors text-sm font-medium shadow-sm flex items-center gap-2">
                <i class="fa-solid fa-video"></i> Load MP4
                <input type="file" id="video-upload" accept="video/mp4,video/webm" class="hidden">
            </label>
            <label id="audio-upload-label" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 opacity-50 cursor-not-allowed rounded-lg transition-colors text-sm font-medium shadow-sm flex items-center gap-2">
                <i class="fa-solid fa-music"></i> Add MP3
                <input type="file" id="audio-upload" accept="audio/mp3,audio/wav,audio/mpeg" class="hidden" disabled multiple>
            </label>
        </div>
    </header>

    <main class="flex-1 flex flex-col p-4 gap-4 overflow-hidden">
        
        <div class="flex-1 glass-panel rounded-xl flex flex-col overflow-hidden relative shadow-2xl relative">
            
            <!-- Video Container -->
            <div class="flex-1 bg-black relative flex items-center justify-center overflow-hidden" id="video-container">
                <div id="video-placeholder" class="text-slate-500 flex flex-col items-center gap-4">
                    <i class="fa-solid fa-film text-6xl opacity-50"></i>
                    <p>Load a video to start dubbing</p>
                </div>
                <video id="main-video" class="absolute w-full h-full object-contain hidden" playsinline></video>
            </div>

            <!-- Transport Controls -->
            <div class="p-3 border-t border-slate-700 bg-slate-800/80 flex items-center justify-between shrink-0">
                <div class="flex items-center gap-4 w-1/3">
                    <button id="btn-play-pause" class="w-10 h-10 rounded-full bg-indigo-600 hover:bg-indigo-500 flex items-center justify-center transition-transform hover:scale-105 disabled:opacity-50 disabled:cursor-not-allowed" disabled>
                        <i class="fa-solid fa-play ml-1" id="icon-play"></i>
                        <i class="fa-solid fa-pause hidden" id="icon-pause"></i>
                    </button>
                    <div class="text-sm font-mono text-slate-300 w-32">
                        <span id="time-current">00:00.0</span> / <span id="time-total">00:00.0</span>
                    </div>
                </div>

                <div class="flex items-center justify-end gap-3 w-1/3">
                    <button id="btn-video-mute" class="text-slate-400 hover:text-white transition-colors disabled:opacity-50" disabled title="Mute Original Video">
                        <i class="fa-solid fa-volume-high" id="icon-vol"></i>
                    </button>
                    <input type="range" id="video-volume" min="0" max="1" step="0.05" value="1" class="w-24 cursor-pointer disabled:opacity-50" disabled>
                </div>
            </div>
        </div>

        <div class="h-64 glass-panel rounded-xl flex flex-col shadow-xl shrink-0">
            <div class="px-4 py-2 border-b border-slate-700 flex justify-between items-center text-xs font-semibold text-slate-400 bg-slate-800/50 rounded-t-xl">
                <span>TIMELINE</span>
                <span id="timeline-status">Waiting for video...</span>
            </div>
            
            <!-- Tracks Container -->
            <div class="flex-1 overflow-y-auto overflow-x-hidden relative" id="tracks-wrapper">
                
                <!-- Time Ruler -->
                <div class="h-6 border-b border-slate-700 relative text-[10px] text-slate-500 select-none bg-slate-900/50" id="time-ruler">
                    <!-- Ticks populated by JS -->
                </div>

                <!-- Timeline Interactive Area -->
                <div id="timeline-container" class="relative w-full min-h-[150px] cursor-text">
                    <div id="playhead"></div>
                    <div id="tracks-container" class="w-full h-full flex flex-col gap-1 p-1">
                        <!-- Tracks populated by JS -->
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        // --- State ---
        let audioContext = null;
        let videoDuration = 0;
        let isPlaying = false;
        let audioChunks = []; // { id, name, buffer, startTime, duration, volume, trackIndex, color, sourceNode, gainNode }
        let nextTrackIndex = 0;
        let animationFrameId = null;

        // --- DOM Elements ---
        const videoEl = document.getElementById('main-video');
        const videoPlaceholder = document.getElementById('video-placeholder');
        const btnPlayPause = document.getElementById('btn-play-pause');
        const iconPlay = document.getElementById('icon-play');
        const iconPause = document.getElementById('icon-pause');
        const timeCurrentEl = document.getElementById('time-current');
        const timeTotalEl = document.getElementById('time-total');
        const timelineContainer = document.getElementById('timeline-container');
        const tracksContainer = document.getElementById('tracks-container');
        const playhead = document.getElementById('playhead');
        const timeRuler = document.getElementById('time-ruler');
        const btnVideoMute = document.getElementById('btn-video-mute');
        const videoVolumeSlider = document.getElementById('video-volume');
        const audioUploadLabel = document.getElementById('audio-upload-label');
        const audioUploadInput = document.getElementById('audio-upload');
        const timelineStatus = document.getElementById('timeline-status');

        // Colors for audio chunks
        const colors = [
            'bg-blue-600', 'bg-emerald-600', 'bg-purple-600', 
            'bg-rose-600', 'bg-amber-600', 'bg-cyan-600'
        ];

        // --- Audio Context Setup ---
        function initAudioContext() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioContext.state === 'suspended') {
                audioContext.resume();
            }
        }

        // Utility: Format Time
        function formatTime(seconds) {
            if (isNaN(seconds)) return "00:00.0";
            const m = Math.floor(seconds / 60).toString().padStart(2, '0');
            const s = Math.floor(seconds % 60).toString().padStart(2, '0');
            const ms = Math.floor((seconds % 1) * 10).toString();
            return `${m}:${s}.${ms}`;
        }

        document.getElementById('video-upload').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const url = URL.createObjectURL(file);
            videoEl.src = url;
            videoEl.classList.remove('hidden');
            videoPlaceholder.classList.add('hidden');

            videoEl.onloadedmetadata = () => {
                videoDuration = videoEl.duration;
                timeTotalEl.textContent = formatTime(videoDuration);
                btnPlayPause.disabled = false;
                btnVideoMute.disabled = false;
                videoVolumeSlider.disabled = false;
                
                // Enable audio uploading
                audioUploadInput.disabled = false;
                audioUploadLabel.classList.remove('opacity-50', 'cursor-not-allowed');
                timelineStatus.textContent = "Ready. Add MP3 files.";
                
                renderTimeRuler();
                updatePlayhead();
            };
        });

        // Master Play/Pause
        btnPlayPause.addEventListener('click', togglePlayback);

        function togglePlayback() {
            initAudioContext();
            if (videoEl.paused) {
                playMaster();
            } else {
                pauseMaster();
            }
        }

        function playMaster() {
            videoEl.play();
            isPlaying = true;
            iconPlay.classList.add('hidden');
            iconPause.classList.remove('hidden');
            
            const currentVideoTime = videoEl.currentTime;

            // Start Audio Chunks
            audioChunks.forEach(chunk => {
                // Only schedule if the chunk hasn't finished yet relative to current video time
                if (currentVideoTime < chunk.startTime + chunk.duration) {
                    scheduleAudioChunk(chunk, currentVideoTime);
                }
            });

            updateSync();
        }

        function pauseMaster() {
            videoEl.pause();
            isPlaying = false;
            iconPlay.classList.remove('hidden');
            iconPause.classList.add('hidden');
            
            cancelAnimationFrame(animationFrameId);
            
            // Stop all Web Audio nodes
            audioChunks.forEach(chunk => {
                if (chunk.sourceNode) {
                    try { chunk.sourceNode.stop(); } catch(e) {}
                    chunk.sourceNode.disconnect();
                    chunk.sourceNode = null;
                }
            });
        }

        function scheduleAudioChunk(chunk, currentVideoTime) {
            // Clean up existing node if any
            if (chunk.sourceNode) {
                try { chunk.sourceNode.stop(); } catch(e) {}
                chunk.sourceNode.disconnect();
            }

            const source = audioContext.createBufferSource();
            source.buffer = chunk.buffer;
            
            const gain = audioContext.createGain();
            gain.gain.value = chunk.volume;

            source.connect(gain);
            gain.connect(audioContext.destination);

            chunk.sourceNode = source;
            chunk.gainNode = gain;

            let contextPlayTime;
            let bufferOffset = 0;

            if (currentVideoTime >= chunk.startTime) {
                // Video is already past the chunk's start time. Play immediately with an offset.
                contextPlayTime = audioContext.currentTime;
                bufferOffset = currentVideoTime - chunk.startTime;
            } else {
                // Video is before the chunk's start time. Schedule for the future.
                const delay = chunk.startTime - currentVideoTime;
                contextPlayTime = audioContext.currentTime + delay;
                bufferOffset = 0;
            }

            source.start(contextPlayTime, bufferOffset);
        }

        // Video Volume Controls
        btnVideoMute.addEventListener('click', () => {
            videoEl.muted = !videoEl.muted;
            updateVideoVolumeUI();
        });
        
        videoVolumeSlider.addEventListener('input', (e) => {
            videoEl.volume = e.target.value;
            if(videoEl.volume > 0) videoEl.muted = false;
            updateVideoVolumeUI();
        });

        function updateVideoVolumeUI() {
            const volIcon = document.getElementById('icon-vol');
            volIcon.className = videoEl.muted || videoEl.volume == 0 ? 'fa-solid fa-volume-xmark text-red-400' : 
                                videoEl.volume < 0.5 ? 'fa-solid fa-volume-low' : 'fa-solid fa-volume-high';
        }

        function renderTimeRuler() {
            timeRuler.innerHTML = '';
            if (!videoDuration) return;
            
            const numTicks = 10;
            for (let i = 0; i <= numTicks; i++) {
                const tickTime = (videoDuration / numTicks) * i;
                const pct = (i / numTicks) * 100;
                
                const tick = document.createElement('div');
                tick.className = 'absolute top-0 bottom-0 border-l border-slate-600 flex flex-col justify-end pb-1 pl-1';
                tick.style.left = `${pct}%`;
                tick.textContent = Math.round(tickTime) + 's';
                timeRuler.appendChild(tick);
            }
        }

        function updatePlayhead() {
            if (!videoDuration) return;
            const pct = (videoEl.currentTime / videoDuration) * 100;
            playhead.style.left = `${pct}%`;
            timeCurrentEl.textContent = formatTime(videoEl.currentTime);
        }

        function updateSync() {
            updatePlayhead();
            if (isPlaying) {
                animationFrameId = requestAnimationFrame(updateSync);
            }
        }

        // Seek functionality on timeline click
        timelineContainer.addEventListener('mousedown', (e) => {
            if (!videoDuration || e.target.closest('.audio-chunk')) return;
            handleSeek(e);
            
            // Optional: drag to seek
            const moveHandler = (ev) => handleSeek(ev);
            const upHandler = () => {
                document.removeEventListener('mousemove', moveHandler);
                document.removeEventListener('mouseup', upHandler);
            };
            document.addEventListener('mousemove', moveHandler);
            document.addEventListener('mouseup', upHandler);
        });

        function handleSeek(e) {
            const rect = timelineContainer.getBoundingClientRect();
            let x = e.clientX - rect.left;
            x = Math.max(0, Math.min(x, rect.width));
            
            const pct = x / rect.width;
            const targetTime = pct * videoDuration;
            
            videoEl.currentTime = targetTime;
            updatePlayhead();
            
            if (isPlaying) {
                // Resync audio chunks
                pauseMaster();
                playMaster();
            }
        }

        audioUploadInput.addEventListener('change', async (e) => {
            if (!videoDuration) return;
            initAudioContext();
            
            const files = Array.from(e.target.files);
            
            for (const file of files) {
                timelineStatus.textContent = `Loading ${file.name}...`;
                try {
                    const arrayBuffer = await file.arrayBuffer();
                    const audioBuffer = await audioContext.decodeAudioData(arrayBuffer);
                    
                    addAudioChunk(file.name, audioBuffer);
                } catch (err) {
                    console.error("Error decoding audio:", err);
                    alert(`Failed to load ${file.name}`);
                }
            }
            timelineStatus.textContent = `${audioChunks.length} chunks loaded.`;
            e.target.value = ''; // Reset input
        });

        function addAudioChunk(name, buffer) {
            const color = colors[nextTrackIndex % colors.length];
            
            const chunk = {
                id: 'chunk_' + Date.now() + Math.random().toString(36).substr(2, 9),
                name: name,
                buffer: buffer,
                startTime: 0, // Defaults to start
                duration: buffer.duration,
                volume: 1.0,
                trackIndex: nextTrackIndex,
                color: color,
                sourceNode: null,
                gainNode: null
            };

            audioChunks.push(chunk);
            createTrackRow(chunk.trackIndex);
            renderChunkElement(chunk);
            nextTrackIndex++;
        }

        function createTrackRow(index) {
            let row = document.getElementById(`track-row-${index}`);
            if (!row) {
                row = document.createElement('div');
                row.id = `track-row-${index}`;
                row.className = 'w-full h-12 relative rounded bg-slate-800/30 shrink-0 border border-slate-700/50';
                tracksContainer.appendChild(row);
            }
        }

        function renderChunkElement(chunk) {
            const row = document.getElementById(`track-row-${chunk.trackIndex}`);
            
            const el = document.createElement('div');
            el.id = chunk.id;
            el.className = `audio-chunk ${chunk.color}`;
            
            // Width based on duration relative to video
            const widthPct = (chunk.duration / videoDuration) * 100;
            const leftPct = (chunk.startTime / videoDuration) * 100;
            
            el.style.width = `${Math.max(widthPct, 0.5)}%`; // Min width for visibility
            el.style.left = `${leftPct}%`;

            el.innerHTML = `
                <span class="text-xs font-bold truncate max-w-[50%] px-1 text-white shadow-sm" title="${chunk.name}">${chunk.name}</span>
                <div class="chunk-controls">
                    <input type="range" class="w-12 h-1 volume-slider" min="0" max="2" step="0.05" value="${chunk.volume}" title="Volume">
                    <button class="text-white hover:text-red-300 transition-colors btn-delete" title="Delete">
                        <i class="fa-solid fa-xmark text-xs"></i>
                    </button>
                </div>
            `;

            // Event Listeners for UI inside chunk
            const volSlider = el.querySelector('.volume-slider');
            volSlider.addEventListener('mousedown', (e) => e.stopPropagation()); // Prevent dragging when sliding volume
            volSlider.addEventListener('input', (e) => {
                chunk.volume = parseFloat(e.target.value);
                if (chunk.gainNode) {
                    chunk.gainNode.gain.setValueAtTime(chunk.volume, audioContext.currentTime);
                }
            });

            const btnDelete = el.querySelector('.btn-delete');
            btnDelete.addEventListener('mousedown', (e) => e.stopPropagation());
            btnDelete.addEventListener('click', () => {
                deleteChunk(chunk.id);
            });

            // Drag setup
            setupDraggable(el, chunk);
            row.appendChild(el);
        }

        function setupDraggable(element, chunk) {
            let startX = 0;
            let startLeftPct = 0;
            let isDragging = false;

            element.addEventListener('mousedown', (e) => {
                isDragging = true;
                startX = e.clientX;
                startLeftPct = (chunk.startTime / videoDuration) * 100;
                
                // Pause playback during drag to prevent sync chaos
                if (isPlaying) pauseMaster();
                
                element.style.transition = 'none'; // Disable transition for smooth dragging

                const onMouseMove = (ev) => {
                    if (!isDragging) return;
                    const deltaX = ev.clientX - startX;
                    const containerWidth = timelineContainer.getBoundingClientRect().width;
                    const deltaPct = (deltaX / containerWidth) * 100;
                    
                    let newLeftPct = startLeftPct + deltaPct;
                    
                    // Clamp boundaries (allow extending slightly off right edge if audio is long)
                    if (newLeftPct < 0) newLeftPct = 0;
                    
                    element.style.left = `${newLeftPct}%`;
                    
                    // Update model
                    chunk.startTime = (newLeftPct / 100) * videoDuration;
                };

                const onMouseUp = () => {
                    isDragging = false;
                    element.style.transition = ''; // Restore transitions
                    document.removeEventListener('mousemove', onMouseMove);
                    document.removeEventListener('mouseup', onMouseUp);
                };

                document.addEventListener('mousemove', onMouseMove);
                document.addEventListener('mouseup', onMouseUp);
            });
        }

        function deleteChunk(id) {
            const index = audioChunks.findIndex(c => c.id === id);
            if (index > -1) {
                const chunk = audioChunks[index];
                if (chunk.sourceNode) {
                    try { chunk.sourceNode.stop(); } catch(e){}
                    chunk.sourceNode.disconnect();
                }
                
                document.getElementById(id).remove();
                
                // Remove empty track row if needed (optional optimization, we leave it for simplicity and layout stability)
                
                audioChunks.splice(index, 1);
                timelineStatus.textContent = `${audioChunks.length} chunks remaining.`;
            }
        }

        // Handle video end to stop audio loops
        videoEl.addEventListener('ended', () => {
            pauseMaster();
            videoEl.currentTime = 0;
            updatePlayhead();
        });

    </script>
</body>
</html>
